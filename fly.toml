app = 'foodera-leadbot'
primary_region = 'fra'

[build]
  dockerfile = "Dockerfile"

[env]
  LOG_LEVEL = "INFO"
  LOG_JSON = "true"
  DISPLAY_TIMEZONE = "Asia/Tashkent"
  AUTO_CREATE_TABLES = "false"
  ADMIN_PANEL_ENABLED = "true"
  ADMIN_PANEL_HOST = "0.0.0.0"
  ADMIN_PANEL_PORT = "8080"
  MALLOC_ARENA_MAX = "2"
  PYTHONUNBUFFERED = "1"

[processes]
  app = "python -m app.main"

[deploy]
  release_command = "alembic upgrade head"
  strategy = "rolling"

[[restart]]
  policy = "always"
  processes = ["app"]

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80
