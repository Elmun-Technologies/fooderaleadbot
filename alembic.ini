# Alembic configuration for the FOODERA lead bot.
#
# The database URL is NOT stored here - alembic/env.py reads DATABASE_URL from the
# environment / .env through app.config, so migrations always run against the same
# database as the bot.
#
#   alembic revision --autogenerate -m "change"
#   alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC
version_path_separator = os

[post_write_hooks]
# keep generated migrations formatted like the rest of the project
hooks = ruff
ruff.type = console
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
